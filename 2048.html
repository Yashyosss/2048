<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>2048</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-board: #bbada0;
    --cell-empty: #cdc1b4;
    --ivory: #f8f4ef;
    --dark-text: #6b5c50;
    --muted: #9d8d80;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; padding:20px 12px; min-height:100%;
    display:flex; align-items:center; justify-content:center;
    background:transparent;
    font-family:'Inter',system-ui,sans-serif;
    -webkit-user-select:none; user-select:none;
  }
  .wrap{ width:100%; max-width:420px; }
  .top-row{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:10px;
  }
  h1{
    font-family:'Baloo 2', sans-serif;
    color:var(--dark-text);
    font-size:clamp(28px,7vw,38px);
    margin:0;
  }
  .scores{ display:flex; gap:8px; }
  .score-box{
    background: var(--bg-board);
    border-radius:8px;
    padding:6px 14px;
    text-align:center;
    color:var(--ivory);
  }
  .score-box .label{ font-size:10px; letter-spacing:.5px; opacity:.8; }
  .score-box .value{ font-family:'Baloo 2',sans-serif; font-size:18px; }

  .subtitle{ color:var(--muted); font-size:13px; margin:0 0 12px; }

  .board-wrap{ position:relative; }
  .board{
    background: var(--bg-board);
    border-radius:10px;
    padding:8px;
    display:grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(4, 1fr);
    gap:8px;
    aspect-ratio:1/1;
  }
  .cell{
    background: var(--cell-empty);
    border-radius:6px;
    display:flex; align-items:center; justify-content:center;
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    position:relative;
    overflow:hidden;
  }
  .cell .tile{
    width:100%; height:100%;
    display:flex; align-items:center; justify-content:center;
    border-radius:6px;
    animation: pop .15s ease;
  }
  @keyframes pop{ from{ transform:scale(0.5); opacity:.4; } to{ transform:scale(1); opacity:1; } }

  .v2{ background:#eee4da; color:#6b5c50; font-size:clamp(20px,7vw,30px); }
  .v4{ background:#ede0c8; color:#6b5c50; font-size:clamp(20px,7vw,30px); }
  .v8{ background:#f2b179; color:#fff; font-size:clamp(20px,7vw,30px); }
  .v16{ background:#f59563; color:#fff; font-size:clamp(18px,6.5vw,28px); }
  .v32{ background:#f67c5f; color:#fff; font-size:clamp(18px,6.5vw,28px); }
  .v64{ background:#f65e3b; color:#fff; font-size:clamp(18px,6.5vw,28px); }
  .v128{ background:#edcf72; color:#fff; font-size:clamp(16px,5.5vw,24px); }
  .v256{ background:#edcc61; color:#fff; font-size:clamp(16px,5.5vw,24px); }
  .v512{ background:#edc850; color:#fff; font-size:clamp(16px,5.5vw,24px); }
  .v1024{ background:#edc53f; color:#fff; font-size:clamp(14px,5vw,20px); }
  .v2048{ background:#edc22e; color:#fff; font-size:clamp(14px,5vw,20px); box-shadow:0 0 20px rgba(237,194,46,.7); }
  .vbig{ background:#3c3a32; color:#fff; font-size:clamp(13px,4.5vw,18px); }

  .overlay{
    position:absolute; inset:8px;
    background: rgba(238,228,218,.82);
    border-radius:10px;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:16px;
  }
  .overlay.hidden{ display:none; }
  .overlay h2{ font-family:'Baloo 2',sans-serif; color:var(--dark-text); font-size:26px; margin:0 0 6px; }
  .overlay p{ color:var(--dark-text); font-size:14px; margin:0 0 14px; }
  .overlay-btns{ display:flex; gap:8px; }
  .overlay button{
    font-family:'Inter',sans-serif; font-weight:600; font-size:13px;
    background: var(--bg-board); color:#fff; border:none;
    padding:9px 16px; border-radius:8px; cursor:pointer;
  }

  .footer{ display:flex; justify-content:center; margin-top:16px; }
  .reset-btn{
    background:none; border:1px solid #c7b9ac; color:var(--muted);
    font-family:'Inter',sans-serif; font-size:13px; padding:7px 14px;
    border-radius:8px; cursor:pointer;
  }
  .reset-btn:hover{ color:var(--dark-text); border-color:var(--dark-text); }
</style>
</head>
<body>
<div class="wrap">
  <div class="top-row">
    <h1>2048</h1>
    <div class="scores">
      <div class="score-box"><div class="label">SCORE</div><div class="value" id="score">0</div></div>
      <div class="score-box"><div class="label">BEST</div><div class="value" id="best">0</div></div>
    </div>
  </div>
  <p class="subtitle">arrow keys or swipe — combine tiles to reach 2048</p>

  <div class="board-wrap">
    <div class="board" id="board"></div>
    <div class="overlay hidden" id="overlay">
      <h2 id="overlay-title">You win!</h2>
      <p id="overlay-text">You reached 2048.</p>
      <div class="overlay-btns">
        <button id="overlay-continue">Keep Going</button>
        <button id="overlay-new">New Game</button>
      </div>
    </div>
  </div>

  <div class="footer">
    <button class="reset-btn" id="reset">New Game</button>
  </div>
</div>

<script>
const SIZE = 4;
let board, score, best, wonShown, gameOver, newTilePos;

const boardEl = document.getElementById('board');
const scoreEl = document.getElementById('score');
const bestEl = document.getElementById('best');
const overlay = document.getElementById('overlay');
const overlayTitle = document.getElementById('overlay-title');
const overlayText = document.getElementById('overlay-text');

best = 0;

function emptyBoard(){
  return Array.from({length:SIZE}, () => Array(SIZE).fill(0));
}

function init(){
  board = emptyBoard();
  score = 0;
  wonShown = false;
  gameOver = false;
  newTilePos = null;
  spawnTile(); spawnTile();
  buildDom();
  render();
  overlay.classList.add('hidden');
}

function buildDom(){
  boardEl.innerHTML = '';
  for (let i = 0; i < SIZE*SIZE; i++){
    const cell = document.createElement('div');
    cell.className = 'cell';
    boardEl.appendChild(cell);
  }
}

function emptyCells(b){
  const out = [];
  for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) if (b[r][c] === 0) out.push([r,c]);
  return out;
}

function spawnTile(){
  const cells = emptyCells(board);
  if (cells.length === 0) return false;
  const [r,c] = cells[Math.floor(Math.random()*cells.length)];
  board[r][c] = Math.random() < 0.9 ? 2 : 4;
  newTilePos = [r,c];
  return true;
}

function arraysEqual(a,b){
  return a.length === b.length && a.every((v,i) => v === b[i]);
}

// merges one line (array of 4 numbers, 0 = empty) toward the left.
// each tile merges at most once per move.
function mergeLine(line){
  const nums = line.filter(v => v !== 0);
  const merged = [];
  let scoreGained = 0;
  let i = 0;
  while (i < nums.length){
    if (i+1 < nums.length && nums[i] === nums[i+1]){
      const val = nums[i]*2;
      merged.push(val);
      scoreGained += val;
      i += 2;
    } else {
      merged.push(nums[i]);
      i += 1;
    }
  }
  while (merged.length < SIZE) merged.push(0);
  return { line: merged, scoreGained, changed: !arraysEqual(merged, line) };
}

function transpose(b){
  const t = emptyBoard();
  for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) t[c][r] = b[r][c];
  return t;
}

function moveLeftBoard(b){
  let changed = false, gained = 0;
  const nb = b.map(row => {
    const res = mergeLine(row);
    if (res.changed) changed = true;
    gained += res.scoreGained;
    return res.line;
  });
  return { board: nb, changed, gained };
}

function moveRightBoard(b){
  const reversed = b.map(row => row.slice().reverse());
  const res = moveLeftBoard(reversed);
  return { board: res.board.map(row => row.slice().reverse()), changed: res.changed, gained: res.gained };
}

function moveUpBoard(b){
  const t = transpose(b);
  const res = moveLeftBoard(t);
  return { board: transpose(res.board), changed: res.changed, gained: res.gained };
}

function moveDownBoard(b){
  const t = transpose(b);
  const res = moveRightBoard(t);
  return { board: transpose(res.board), changed: res.changed, gained: res.gained };
}

function move(direction){
  if (gameOver) return;
  let result;
  if (direction === 'left') result = moveLeftBoard(board);
  else if (direction === 'right') result = moveRightBoard(board);
  else if (direction === 'up') result = moveUpBoard(board);
  else if (direction === 'down') result = moveDownBoard(board);
  else return;

  if (!result.changed) return;

  board = result.board;
  score += result.gained;
  if (score > best) best = score;
  spawnTile();
  render();

  if (!wonShown && hasTile(2048)){
    wonShown = true;
    showOverlay('You win!', 'You reached 2048. Keep going or start fresh.', true);
    return;
  }
  if (!hasMovesLeft(board)){
    gameOver = true;
    showOverlay('Game over', `Final score: ${score}`, false);
  }
}

function hasTile(target){
  return board.some(row => row.some(v => v >= target));
}

function hasMovesLeft(b){
  for (let r = 0; r < SIZE; r++){
    for (let c = 0; c < SIZE; c++){
      if (b[r][c] === 0) return true;
      if (c < SIZE-1 && b[r][c] === b[r][c+1]) return true;
      if (r < SIZE-1 && b[r][c] === b[r+1][c]) return true;
    }
  }
  return false;
}

function showOverlay(title, text, isWin){
  overlayTitle.textContent = title;
  overlayText.textContent = text;
  document.getElementById('overlay-continue').style.display = isWin ? 'inline-block' : 'none';
  overlay.classList.remove('hidden');
}

document.getElementById('overlay-continue').addEventListener('click', () => {
  overlay.classList.add('hidden');
});
document.getElementById('overlay-new').addEventListener('click', init);
document.getElementById('reset').addEventListener('click', init);

document.addEventListener('keydown', (e) => {
  const map = { ArrowLeft:'left', ArrowRight:'right', ArrowUp:'up', ArrowDown:'down' };
  if (map[e.key]){
    e.preventDefault();
    move(map[e.key]);
  }
});

let touchStart = null;
document.addEventListener('touchstart', (e) => {
  touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
}, { passive:true });
document.addEventListener('touchend', (e) => {
  if (!touchStart) return;
  const dx = e.changedTouches[0].clientX - touchStart.x;
  const dy = e.changedTouches[0].clientY - touchStart.y;
  touchStart = null;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
  if (Math.abs(dx) > Math.abs(dy)) move(dx > 0 ? 'right' : 'left');
  else move(dy > 0 ? 'down' : 'up');
}, { passive:true });

function tileClass(v){
  if (v <= 2048) return 'v' + v;
  return 'vbig';
}

function render(){
  scoreEl.textContent = score;
  bestEl.textContent = best;
  for (let r = 0; r < SIZE; r++){
    for (let c = 0; c < SIZE; c++){
      const cellEl = boardEl.children[r*SIZE + c];
      cellEl.innerHTML = '';
      const v = board[r][c];
      if (v !== 0){
        const tile = document.createElement('div');
        tile.className = 'tile ' + tileClass(v);
        tile.textContent = v;
        cellEl.appendChild(tile);
      }
    }
  }
}

init();
</script>
</body>
</html>
